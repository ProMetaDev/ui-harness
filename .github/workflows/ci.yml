name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UI_BUILD_DIR: ${{ github.workspace }}
      UI_TARGET_DIR: ${{ github.workspace }}/target
      UI_GIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 环境诊断
        run: |
          set +e
          echo "== uname =="; uname -a
          echo "== 工具 =="
          for c in python3 cargo git curl rsync fuser pkill pgrep script ss awk sed grep diff timeout; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
          done
          echo "== 版本 =="; python3 --version; cargo --version
          echo "== UI_ 环境 =="; env | grep -E '^UI_' || true

      - name: CI（preflight → 构建 → 版本/密钥 → 测试 → 门禁）
        run: bash tools/ci.sh

      - name: 发布包
        run: bash tools/release.sh

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: |
            dist/*.tar.gz
            dist/**/*.sha256
          if-no-files-found: error

      # 失败时把「失败步骤的日志」直接打进这一步的输出：
      # 这样贴最后一步的日志就等于贴到了出错现场，不需要再去翻上面的步骤。
      - name: 失败诊断
        if: failure()
        run: |
          echo "===================== 失败诊断开始 ====================="
          echo "---- 失败步骤的最后 80 行 ----"
          if [ -f .ci-step.log ]; then
            tail -80 .ci-step.log
          else
            echo "（没有 .ci-step.log）"
          fi
          echo "---- 环境再确认 ----"
          for c in fuser pkill pgrep script rsync python3; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
          done
          echo "aria2c/diffutils 无关，仅确认基础工具"
          echo "===================== 失败诊断结束 ====================="
          mkdir -p ci-logs
          cp -f .ci-step.log ci-logs/ 2>/dev/null || true

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore
