name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UI_BUILD_DIR: ${{ github.workspace }}
      UI_TARGET_DIR: ${{ github.workspace }}/target
      UI_GIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 先打印真实环境：脚本假设有 fuser/pkill/script/rsync，缺哪个一目了然
      - name: 环境诊断
        run: |
          set +e
          echo "== uname =="; uname -a
          echo "== 工具 =="
          for c in python3 cargo git curl rsync fuser pkill pgrep script ss awk sed grep; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
          done
          echo "== 版本 =="; python3 --version; cargo --version
          echo "== UI_ 环境 =="; env | grep -E '^UI_' || true
          echo "== 磁盘 =="; df -h . | tail -1

      - name: CI（preflight → 构建 → 版本/密钥 → 测试 → 门禁）
        run: bash tools/ci.sh

      - name: 发布包
        run: bash tools/release.sh

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: |
            dist/*.tar.gz
            dist/**/*.sha256
          if-no-files-found: error

      # 失败时把 CI 日志作为 artifact 留下，便于事后查（网页上看不到时也能下载）
      - name: 失败时保存日志
        if: failure()
        run: |
          mkdir -p ci-logs
          cp -f /tmp/ci-step.log ci-logs/ 2>/dev/null || true
          bash tools/preflight.sh > ci-logs/preflight.txt 2>&1 || true
          env | grep -E '^UI_' > ci-logs/env.txt 2>/dev/null || true

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore
