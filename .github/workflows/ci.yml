name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # checkout 就在本地盘，不需要 rsync 到 ext4 副本（sync.sh 会自己跳过）
      UI_BUILD_DIR: ${{ github.workspace }}
      UI_TARGET_DIR: ${{ github.workspace }}/target
      UI_GIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --version 依赖 git rev-parse；浅克隆够用，但要能读到 HEAD
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 关键：不在 workflow 里复制步骤，直接调 tools/ci.sh。
      # 之前 workflow 自己排了顺序，把「版本检查」排在建构建之前，于是三次全红——
      # 而本地 ci.sh 的顺序是对的。一份来源，才不会漂移。
      - name: CI（preflight → 构建 → 版本/密钥 → 测试 → 门禁）
        run: bash tools/ci.sh

      - name: 发布包
        run: bash tools/release.sh

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: |
            dist/*.tar.gz
            dist/**/*.sha256
          if-no-files-found: error
