name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      UI_BUILD_DIR: ${{ github.workspace }}
      UI_TARGET_DIR: ${{ github.workspace }}/target
      UI_GIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 环境诊断
        run: |
          set +e
          echo "== 工具 =="
          for c in python3 cargo git curl rsync fuser pkill pgrep script ss awk sed grep diff timeout; do
            printf '%-8s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
          done
          echo "== 版本 =="; python3 --version; cargo --version

      - name: CI（preflight → 构建 → 版本/密钥 → 测试 → 门禁）
        run: bash tools/ci.sh

      - name: 发布包
        run: bash tools/release.sh

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: |
            dist/*.tar.gz
            dist/**/*.sha256
          if-no-files-found: error

      - name: 失败诊断
        if: failure()
        run: |
          {
            echo "## 失败诊断"
            echo '```'
            tail -80 .ci-step.log 2>/dev/null || echo "（没有 .ci-step.log）"
            echo '```'
            echo "## 环境"
            echo '```'
            for c in fuser pkill pgrep script rsync python3; do
              printf '%-8s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
            done
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # 同时把关键行写成注解：注解可以通过 API 读到，
          # 而 job 日志下载需要鉴权（本地排查时很有用）。
          {
            echo "step-log 行数: $(wc -l < .ci-step.log 2>/dev/null)"
            grep -nE 'FAIL|passed,|panic|Killed|error:' .ci-step.log 2>/dev/null | tail -20
            echo '--- tail ---'
            tail -20 .ci-step.log 2>/dev/null
          } | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error::${line}"
          done

          mkdir -p ci-logs
          cp -f .ci-step.log ci-logs/ 2>/dev/null || true

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore

  windows:
    runs-on: ubuntu-latest
    env:
      UI_BUILD_DIR: ${{ github.workspace }}
      UI_TARGET_DIR: ${{ github.workspace }}/target
      UI_GIT_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 mingw 链接器
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: 安装 Rust + windows-gnu target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-win-

      - name: 交叉编译 ui.exe
        run: bash tools/build_windows.sh

      - name: 上传 ui.exe
        uses: actions/upload-artifact@v4
        with:
          name: ui-windows
          path: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/ui.exe
          if-no-files-found: error
