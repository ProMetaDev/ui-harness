<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#0b0d10;--panel:#12161b;--line:#232a33;--text:#ece9e0;--muted:#8f8d83;--faint:#66665f;--accent:#e3a24b;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Code",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);padding:34px 40px;width:1800px}
  header{display:flex;align-items:baseline;gap:16px;margin-bottom:22px}
  h1{margin:0;font-size:20px;letter-spacing:-.02em}
  header .k{color:var(--faint);font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase}
  header .line{flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:820px 820px;gap:80px}
  figure{margin:0;width:820px}
  .shot{width:820px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
  .shot img{display:block;width:820px;height:auto}
  figcaption{display:flex;align-items:baseline;gap:10px;margin-top:10px}
  figcaption b{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
  figcaption .old{color:var(--faint)}
  figcaption .new{color:var(--accent)}
  figcaption span{color:var(--faint);font-size:11px;margin-left:auto}
  .notes{display:grid;grid-template-columns:820px 820px;gap:80px;margin-top:18px;color:var(--muted);font-size:12px}
  .notes div{border-top:1px solid var(--line);padding-top:10px}
  .notes b{color:var(--text);font-weight:500}
</style>
</head>
<body>
  <header>
    <span class="k">UI / before → after</span>
    <h1>从「通用聊天」到「飞行记录仪」</h1>
    <span class="line"></span>
  </header>
  <div class="grid">
    <figure>
      <div class="shot"><img src="../out/fix-chat.png" alt="改造前"></div>
      <figcaption><b class="old">Before</b><span>蓝白 SaaS 壳 · 右栏只有 kv 表 · 审批在滚动区</span></figcaption>
    </figure>
    <figure>
      <div class="shot"><img src="shot-dark.png" alt="改造后"></div>
      <figcaption><b class="new">After</b><span>暗色仪表盘 · 当前步右栏 · 审批固定在输入框上方</span></figcaption>
    </figure>
  </div>
  <div class="notes">
    <div><b>对话</b> 气泡 → 时间 / 角色 / 工具 / 决策共用一条时间线；工具两行，第一行身份与效果，第二行结果。</div>
    <div><b>当前步</b> 账本 kv → 快照分段条 + 决策时间线 + 预算 + 审批队列，数据来自 on_snapshot / on_decision。</div>
  </div>
</body>
</html>
