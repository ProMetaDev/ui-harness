<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI · 执行轨迹</title>
<style>
  :root{
    --bg:#fbfbfc; --panel:#ffffff; --subtle:#f6f6f7; --hover:#f0f0f2;
    --border:#e6e6e9; --border-strong:#d5d5da;
    --text:#18181b; --muted:#6f6f78; --faint:#a3a3ad;
    --accent:#4f46e5; --accent-soft:#eef0ff;
    --ok:#15803d; --ok-soft:#eefaf1; --warn:#b45309; --warn-soft:#fdf6e7;
    --bad:#b91c1c; --bad-soft:#fdf1f1;
    --r:10px; --r-sm:7px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --shadow:0 1px 2px rgba(16,16,20,.04),0 1px 3px rgba(16,16,20,.06);
  }
  html[data-theme="dark"]{
    --bg:#0a0a0b; --panel:#131316; --subtle:#18181b; --hover:#1e1e22;
    --border:#28282d; --border-strong:#3a3a41;
    --text:#f4f4f5; --muted:#a1a1aa; --faint:#6f6f78;
    --accent:#8b8bf5; --accent-soft:#1d1b3a;
    --ok:#4ade80; --ok-soft:#10241a; --warn:#fbbf24; --warn-soft:#2a2008;
    --bad:#f87171; --bad-soft:#2b1414;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#0a0a0b; --panel:#131316; --subtle:#18181b; --hover:#1e1e22;
      --border:#28282d; --border-strong:#3a3a41;
      --text:#f4f4f5; --muted:#a1a1aa; --faint:#6f6f78;
      --accent:#8b8bf5; --accent-soft:#1d1b3a;
      --ok:#4ade80; --ok-soft:#10241a; --warn:#fbbf24; --warn-soft:#2a2008;
      --bad:#f87171; --bad-soft:#2b1414;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100%}

  /* ── 顶栏 ── */
  .top{display:flex;align-items:center;gap:14px;padding:0 20px;
       background:var(--panel);border-bottom:1px solid var(--border)}
  .mark{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em}
  .mark .box{width:22px;height:22px;border-radius:6px;background:var(--accent);
             color:#fff;display:grid;place-items:center;font:600 11px/1 var(--mono)}
  .crumb{color:var(--faint);font-size:12.5px;display:flex;gap:6px;align-items:center}
  .crumb b{color:var(--muted);font-weight:500}
  .spacer{flex:1}
  .stat{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
  .stat b{color:var(--text);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
       background:var(--panel);color:var(--text);border:1px solid var(--border-strong);
       border-radius:var(--r-sm);font:500 12.5px/1 var(--sans);cursor:pointer;
       transition:background .12s,border-color .12s}
  .btn:hover{background:var(--hover)}
  .btn:active{transform:translateY(.5px)}

  .body{display:grid;grid-template-columns:288px minmax(0,1fr) 320px;min-height:0}

  /* ── 左栏：步骤 ── */
  nav{border-right:1px solid var(--border);background:var(--panel);
      min-height:0;display:flex;flex-direction:column}
  .nav-h{display:flex;align-items:center;justify-content:space-between;
         padding:14px 16px 8px}
  .nav-h span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .nav-h em{font-style:normal;color:var(--faint);font-size:11px}
  .list{overflow:auto;padding:0 8px 12px}
  .step{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;
        width:100%;text-align:left;background:none;border:0;cursor:pointer;
        padding:9px 8px;border-radius:var(--r-sm);color:var(--text);font:inherit}
  .step:hover{background:var(--hover)}
  .step[aria-selected="true"]{background:var(--accent-soft)}
  .step[aria-selected="true"] .t{color:var(--accent);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;justify-self:center}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.ask{background:var(--warn)}
  .step .main{min-width:0}
  .step .t{font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:baseline}
  .step .t span{color:var(--faint);font-weight:400;font-family:var(--mono);font-size:11px}
  .step .sub{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis;margin-top:2px}

  /* ── 中栏 ── */
  section{overflow:auto;min-height:0;padding:20px 24px 40px}
  .page{max-width:980px}
  .head h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.015em}
  .head .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
        border-radius:999px;font-size:11.5px;background:var(--subtle);
        border:1px solid var(--border);color:var(--muted)}
  .chip b{color:var(--text);font-weight:600;font-family:var(--mono)}
  .chip.allow{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .chip.deny{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .chip.ask{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
        box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .card-h{display:flex;align-items:center;justify-content:space-between;
          padding:11px 14px;border-bottom:1px solid var(--border)}
  .card-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text)}
  .card-h .meta{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
  .card-b{padding:6px 14px 12px}
  .card-b.flush{padding:0}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 6px;font-size:12.5px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:0}
  th{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  tbody tr:hover{background:var(--subtle)}
  tr.total td{font-weight:600;border-top:1px solid var(--border-strong)}
  tr.call{cursor:pointer}
  tr.call[aria-selected="true"]{background:var(--accent-soft)}
  .k{color:var(--muted);font-family:var(--mono);font-size:12px}

  .quote{margin:10px 14px 14px;padding:10px 12px;background:var(--subtle);
         border-left:2px solid var(--border-strong);border-radius:0 var(--r-sm) var(--r-sm) 0;
         font-size:13px;white-space:pre-wrap}
  .code{position:relative}
  .code pre{margin:0;padding:12px 14px;background:var(--subtle);
            font:12.5px/1.55 var(--mono);overflow:auto;white-space:pre-wrap;word-break:break-word}
  .code .copy{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .12s}
  .code:hover .copy,.code:focus-within .copy{opacity:1}
  .empty{padding:14px;color:var(--faint);font-size:12.5px}

  /* ── 右栏：账本 ── */
  aside{border-left:1px solid var(--border);background:var(--panel);
        overflow:auto;min-height:0;padding:16px}
  aside h2{margin:2px 0 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
           color:var(--faint);font-weight:600}
  .metric{margin-bottom:14px}
  .metric .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .metric .row span{color:var(--muted);font-size:12px}
  .metric .row b{font-family:var(--mono);font-size:12.5px;font-weight:600}
  .track{height:6px;border-radius:3px;background:var(--subtle);margin-top:7px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .pct{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .kv{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  .kv .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--muted)}
  .kv .row b{color:var(--text);font-family:var(--mono);font-weight:500}

  .foot{position:fixed;left:0;right:0;bottom:0;display:none}

  @media (max-width:1180px){ .body{grid-template-columns:280px minmax(0,1fr)} aside{display:none} }
  @media (max-width:820px){ .body{grid-template-columns:1fr} nav{display:none} section{padding:16px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"><span class="box">U:I</span><span>执行轨迹</span></div>
    <div class="crumb"><b id="ws">demo</b><span>/</span><span id="file">journal.jsonl</span></div>
    <div class="spacer"></div>
    <div class="stat"><b id="n-steps">0</b> 步</div>
    <div class="stat"><b id="n-events">0</b> 事件</div>
    <button class="btn" id="theme" title="切换浅色/深色">◐ 主题</button>
    <button class="btn" id="copy-all" title="复制整份日志 JSON">复制日志</button>
  </header>

  <div class="body">
    <nav>
      <div class="nav-h"><span>步骤</span><em>↑↓ 切换</em></div>
      <div class="list" id="steps"></div>
    </nav>
    <section id="detail"></section>
    <aside>
      <h2>账本</h2>
      <div id="ledger"></div>
      <div class="kv" id="facts"></div>
    </aside>
  </div>
</div>

<script id="ui-data" type="application/json">__UI_DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("ui-data").textContent);
  const events = DATA.events || [];
  const limits = DATA.limits || {};

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const pad = (n) => String(n).padStart(2, "0");
  const clock = (ms) => {
    const d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  };

  /* 事件流 → 步骤 */
  const steps = [];
  const inStep = new Set();
  let cur = null;
  let pendingStart = null;
  for (const e of events) {
    // turn/start 走在快照前面：先攥着，等这一步真的建起来再归位；
    // 要是它后面没有快照（开局就崩），它就留在旁路账里，不会凭空消失。
    if (e.kind === "turn/start") { pendingStart = e; continue; }
    if (e.kind === "prompt/snapshot") {
      cur = { snap: e, calls: [], model: null, repairs: [] };
      if (pendingStart) { inStep.add(pendingStart); cur.start = pendingStart; pendingStart = null; }
      steps.push(cur);
      continue;
    }
    if (!cur) continue;
    inStep.add(e);
    if (e.kind === "model/response") cur.model = e;
    if (e.kind === "model/repair") cur.repairs.push(e);
    if (e.kind === "tool/request") cur.calls.push({ req: e, end: null, approval: null });
    if (e.kind === "tool/end") {
      const c = cur.calls.find((x) => x.req.callId === e.callId);
      if (c) c.end = e;
    }
    if (e.kind === "approval/answered") {
      const c = cur.calls.find((x) => x.req.callId === e.callId);
      if (c) c.approval = e;
    }
    // 一轮到此为止：后面的事件（合并、回滚、被撤掉的排队任务）不属于这一步，
    // 它们走页面底部的"旁路"账——人是按轮说话的，动文件的不一定。
    if (e.kind === "turn/end") cur = null;
  }

  const status = (s) => {
    if (s.calls.some((c) => c.end && c.end.ok === false)) return "bad";
    if (s.calls.some((c) => (c.approval && c.approval.verdict !== "allow") ||
                            c.req.decision === "deny")) return "bad";
    if (s.calls.some((c) => c.req.decision === "ask" && !c.approval)) return "ask";
    return "ok";
  };

  const summary = (s) => {
    if (s.calls.length) {
      const names = s.calls.map((c) => c.req.tool).join(", ");
      return "工具 · " + names;
    }
    const text = (s.model && s.model.content) || "";
    return text ? text.replace(/\s+/g, " ").slice(0, 48) : "只有快照";
  };

  const duration = (i) => {
    const next = steps[i + 1];
    if (!next) return null;
    return Math.max(0, next.snap.ts - steps[i].snap.ts);
  };

  const totalCalls = steps.reduce((n, s) => n + s.calls.length, 0);
  /* 旁路事件：不属于任何一轮对话的操作记录。
     合并（apply/*）、回滚、排队期取消（turn/skipped）、工作流与子代理都在这儿——
     它们是"人或内核对工作区动的手"，审计时最常被问到，却不能只存在于终端输出里。 */
  const extra = events.filter((e) => !inStep.has(e) && e.kind !== "prompt/snapshot");
  const envelope = ["seq", "ts", "w", "prev", "hash", "kind"];
  const brief = (v) => {
    const s = typeof v === "string" ? v : JSON.stringify(v);
    return s.length > 96 ? s.slice(0, 95) + "…" : s;
  };
  const names = (a) => (Array.isArray(a) && a.length ? a.map(brief).join("、") : "无");
  function note(e) {
    switch (e.kind) {
      case "apply/begin":
        return "事务 " + (e.txn || "?") + " · 准备写回 " + (e.files || []).length + " 个：" + names(e.files) + "（原样留底已存，失败会自动退回）";
      case "apply/committed":
        return "事务 " + (e.txn || "?") + " · 已写回 " + (e.written || []).length + " 个：" + names(e.written);
      case "apply/rolled-back":
        return "事务 " + (e.txn || "?") + " · " + (e.stage === "rollback" ? "人手动退回" : "写回失败已自动退回") +
               " · 还原 " + (e.restored || []).length + " 个：" + names(e.restored) +
               ((e.removed || []).length ? " · 删除 " + (e.removed || []).length + " 个：" + names(e.removed) : "") +
               ((e.skipped || []).length ? " · 保留（之后又被改过）：" + names(e.skipped) : "") +
               (e.error ? " · 原因：" + brief(e.error) : "");
      case "apply/abandoned":
        return "事务 " + (e.txn || "?") + " · 被 --force 跳过（半途那笔不再回滚）";
      case "turn/skipped":
        return "任务 " + (e.task || "?") + " · 排队期间被取消，这一轮没有开始（不烧预算）" +
               (e.text ? " · 内容：" + brief(e.text) : "");
      case "workflow/start":
        return brief(e.name) + " · " + (e.steps != null ? e.steps + " 步" : "");
      case "workflow/end":
        return "结束 · " + brief(e.reason) + (e.stoppedAt != null ? " · 停在第 " + e.stoppedAt + " 步" : "");
      case "delegate/end":
        return "子代理 " + brief(e.id) + " · " + (e.ok ? "完成" : "失败") +
               " · 改动 " + (e.changed || []).length + " 个：" + names(e.changed);
      case "journal/torn":
        return "崩溃留下的半条记录已截断";
      default: {
        const parts = [];
        for (const k of Object.keys(e)) {
          if (envelope.indexOf(k) >= 0) continue;
          parts.push(k + "=" + brief(e[k]));
          if (parts.length >= 4) break;
        }
        return parts.join(" · ");
      }
    }
  }
  function sidecard() {
    if (!extra.length) return "";
    let h = '<div class="card"><div class="card-h"><h2>旁路事件</h2>' +
            '<span class="meta">' + extra.length + " 条 · 不属于任何一步</span></div>" +
            '<div class="card-b flush"><table><thead><tr><th class="num">seq</th><th>时间</th>' +
            '<th>事件</th><th>说明</th></tr></thead><tbody>';
    for (const e of extra) {
      h += '<tr><td class="num">' + (e.seq != null ? e.seq : "-") + "</td><td>" +
           '<span class="k">' + clock(e.ts || 0) + "</span></td><td class=\"k\">" + esc(e.kind) +
           "</td><td>" + esc(note(e)) + "</td></tr>";
    }
    return h + "</tbody></table></div></div>";
  }
  const firstTs = events.length ? events[0].ts : 0;
  const lastTs = events.length ? events[events.length - 1].ts : 0;

  document.getElementById("ws").textContent = DATA.workspace || "demo";
  document.getElementById("file").textContent = (DATA.journal || "").split("/").pop();
  document.getElementById("n-steps").textContent = String(steps.length);
  document.getElementById("n-events").textContent = String(events.length);

  /* ── 左栏 ── */
  const nav = document.getElementById("steps");
  // 默认停在第一个有工具调用的步骤：那才是需要看的地方
  let selected = steps.findIndex((s) => s.calls.length > 0);
  if (selected < 0) selected = steps.length ? steps.length - 1 : -1;
  let selectedCall = 0;

  function renderNav() {
    nav.innerHTML = "";
    steps.forEach((s, i) => {
      const st = status(s);
      const b = document.createElement("button");
      b.className = "step";
      b.setAttribute("aria-selected", String(i === selected));
      b.innerHTML =
        '<span class="dot ' + st + '"></span>' +
        '<span class="main"><span class="t">第 ' + (i + 1) + ' 步' +
        '<span>' + clock(s.snap.ts) + "</span></span>" +
        '<span class="sub">' + esc(summary(s)) + "</span></span>";
      b.onclick = () => select(i);
      nav.appendChild(b);
    });
  }

  /* ── 中栏 ── */
  function renderDetail() {
    const box = document.getElementById("detail");
    if (selected < 0) {
      box.innerHTML = '<div class="page"><div class="empty">日志里还没有 prompt/snapshot 事件。</div>' +
                      sidecard() + "</div>";
      return;
    }
    const s = steps[selected];
    const st = status(s);
    const dur = duration(selected);

    let h = '<div class="head"><h1>第 ' + (selected + 1) + ' 步</h1>' +
            '<div class="sub">' + clock(s.snap.ts) +
            (dur != null ? " · 耗时 " + dur + " ms" : "") + "</div></div>";

    h += '<div class="chips">' +
         '<span class="chip ' + (st === "ok" ? "allow" : st === "bad" ? "deny" : "ask") + '">' +
         (st === "ok" ? "正常" : st === "bad" ? "有失败" : "待批准") + "</span>" +
         '<span class="chip">快照 <b>' + s.snap.tokens + "</b> tok</span>" +
         '<span class="chip">正文 <b>' + s.snap.bytes + "</b> B</span>" +
         '<span class="chip">工具 <b>' + s.calls.length + "</b></span></div>";

    /* 快照 */
    h += '<div class="card"><div class="card-h"><h2>提示快照</h2>' +
         '<span class="meta">' + esc(s.snap.snapshotId || "") + "</span></div>" +
         '<div class="card-b flush"><table><thead><tr><th>段</th><th>归属</th>' +
         '<th class="num">bytes</th><th class="num">tokens</th></tr></thead><tbody>';
    for (const sec of (s.snap.sections || [])) {
      h += "<tr><td>" + esc(sec.id) + '</td><td class="k">' + esc(sec.owner) +
           '</td><td class="num">' + sec.bytes + '</td><td class="num">' + sec.tokens + "</td></tr>";
    }
    h += '<tr class="total"><td colspan="2">合计</td><td class="num">' + s.snap.bytes +
         '</td><td class="num">' + s.snap.tokens + "</td></tr></tbody></table></div></div>";

    /* 模型输出 */
    if (s.model && s.model.content) {
      h += '<div class="card"><div class="card-h"><h2>模型输出</h2>' +
           '<span class="meta">' + esc(s.model.model || "") + "</span></div>" +
           '<div class="quote">' + esc(s.model.content) + "</div></div>";
    }

    /* 参数修复 */
    if (s.repairs.length) {
      h += '<div class="card"><div class="card-h"><h2>参数修复</h2></div><div class="card-b">';
      for (const r of s.repairs) {
        h += '<div class="empty">第 ' + r.attempt + " 次 · " + esc(r.tool) + " · " + esc(r.error) + "</div>";
      }
      h += "</div></div>";
    }

    /* 工具调用 */
    h += '<div class="card"><div class="card-h"><h2>工具调用</h2>' +
         '<span class="meta">' + s.calls.length + " 次</span></div>";
    if (!s.calls.length) {
      h += '<div class="empty">这一步没有工具调用。</div>';
    } else {
      h += '<div class="card-b flush"><table><thead><tr><th>工具</th><th>效果</th>' +
           '<th>决策</th><th class="num">结果</th></tr></thead><tbody>';
      s.calls.forEach((c, i) => {
        const eff = (c.req.effects || []).map((x) => x.kind + " " + x.target).join("；");
        const d = c.approval ? c.approval.verdict : (c.req.decision || "?");
        const cls = d === "allow" ? "allow" : d === "deny" ? "deny" : "ask";
        const res = c.end ? (c.end.ok ? "ok" : "失败") : "未执行";
        h += '<tr class="call" data-call="' + i + '" aria-selected="' + (i === selectedCall) +
             '"><td class="k">' + esc(c.req.tool) + '</td><td class="k">' + esc(eff) +
             '</td><td><span class="chip ' + cls + '">' + esc(d) + "</span></td>" +
             '<td class="num">' + esc(res) + "</td></tr>";
      });
      h += "</tbody></table></div>";

      const c = s.calls[Math.min(selectedCall, s.calls.length - 1)];
      h += '<div class="card-h" style="border-top:1px solid var(--border)">' +
           "<h2>原始参数</h2><span class=\"meta\">" + esc(c.req.tool) + "</span></div>" +
           '<div class="code"><button class="btn copy" data-copy="1">复制</button>' +
           "<pre>" + esc(JSON.stringify(c.req.args, null, 2)) + "</pre></div>";
      if (c.end && c.end.error) {
        h += '<div class="empty">错误：' + esc(c.end.error) + "</div>";
      }
    }
    h += "</div>";

    // 步骤之外的人为操作：合并、回滚、取消、工作流、子代理
    h += sidecard();

    box.innerHTML = '<div class="page">' + h + "</div>";
    box.querySelectorAll(".call").forEach((row) => {
      row.onclick = () => { selectedCall = Number(row.dataset.call); renderDetail(); };
    });
    box.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.onclick = () => {
        const text = box.querySelector("pre").textContent;
        copy(text, btn);
      };
    });
  }

  function copy(text, btn) {
    const done = () => { if (btn) { const old = btn.textContent; btn.textContent = "已复制";
      setTimeout(() => { btn.textContent = old; }, 1200); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } else fallback();
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  }

  /* ── 右栏 ── */
  function renderLedger() {
    const last = steps.length ? steps[steps.length - 1].snap.tokens : 0;
    const items = [
      ["Tokens（末步快照）", last, limits.maxTokens],
      ["工具调用", totalCalls, limits.maxToolCalls],
    ];
    let h = "";
    for (const [name, used, limit] of items) {
      const pct = limit ? Math.min(100, (used / limit) * 100) : 0;
      h += '<div class="metric"><div class="row"><span>' + name + "</span><b>" +
           used + (limit ? " / " + limit : "") + "</b></div>" +
           (limit ? '<div class="track"><i style="width:' + Math.max(1, pct).toFixed(1) +
                    '%"></i></div><div class="pct">' + pct.toFixed(1) + "%</div>" : "") +
           "</div>";
    }
    document.getElementById("ledger").innerHTML = h;

    const byTool = {};
    for (const s of steps) for (const c of s.calls) {
      byTool[c.req.tool] = (byTool[c.req.tool] || 0) + 1;
    }
    const facts = [
      ["墙钟", Math.max(0, lastTs - firstTs) + " ms"],
      ["事件", String(events.length)],
      ["步骤", String(steps.length)],
    ];
    if (extra.length) facts.push(["旁路事件", String(extra.length)]);
    let f = facts.map(([k, v]) => '<div class="row"><span>' + k + "</span><b>" + v + "</b></div>").join("");
    const tools = Object.entries(byTool).sort((a, b) => b[1] - a[1]);
    if (tools.length) {
      f += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">' +
           tools.map(([k, v]) => '<div class="row"><span class="k">' + esc(k) + "</span><b>" + v + "</b></div>").join("") +
           "</div>";
    }
    document.getElementById("facts").innerHTML = f;
  }

  function select(i) {
    selected = i; selectedCall = 0;
    renderNav(); renderDetail();
    const el = nav.querySelector('[aria-selected="true"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }

  // 允许用 ?theme=dark / ?theme=light 固定配色（截图与分享常用）
  const qs = new URLSearchParams(location.search).get("theme");
  if (qs === "dark" || qs === "light") document.documentElement.dataset.theme = qs;

  document.getElementById("theme").onclick = () => {
    const order = ["auto", "light", "dark"];
    const cur = document.documentElement.dataset.theme || "auto";
    document.documentElement.dataset.theme = order[(order.indexOf(cur) + 1) % 3];
  };
  document.getElementById("copy-all").onclick = (e) =>
    copy(JSON.stringify(DATA.events, null, 2), e.target);

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "j") {
      select(Math.min(steps.length - 1, selected + 1)); e.preventDefault();
    }
    if (e.key === "ArrowUp" || e.key === "k") {
      select(Math.max(0, selected - 1)); e.preventDefault();
    }
  });

  renderNav(); renderDetail(); renderLedger();
})();
</script>
</body>
</html>
